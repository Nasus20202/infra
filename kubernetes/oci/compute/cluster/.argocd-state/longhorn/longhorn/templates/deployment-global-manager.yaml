---
# Source: longhorn/templates/deployment-global-manager.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: longhorn
    helm.sh/chart: longhorn-1.13.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: longhorn
    app.kubernetes.io/version: v1.13.0
    app: longhorn-global-manager
  name: longhorn-global-manager
  namespace: longhorn-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: longhorn-global-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longhorn
        helm.sh/chart: longhorn-1.13.0
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: longhorn
        app.kubernetes.io/version: v1.13.0
        app: longhorn-global-manager
    spec:
      containers:
      - name: longhorn-global-manager
        image: docker.io/longhornio/longhorn-manager:v1.13.0
        imagePullPolicy: IfNotPresent
        command:
        - longhorn-manager
        - -d
        - global
        ports:
        - containerPort: 9505
          name: healthz
        readinessProbe:
          httpGet:
            path: /v1/healthz
            port: 9505
        livenessProbe:
          httpGet:
            path: /v1/healthz
            port: 9505
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LONGHORN_DISTRO
          value: "longhorn"
        
      priorityClassName: "longhorn-critical"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - longhorn-global-manager
              topologyKey: kubernetes.io/hostname
            weight: 1
      serviceAccountName: longhorn-service-account

