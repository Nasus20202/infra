---
# Source: k8s-monitoring/templates/hooks/pre-delete_remove-alloy-and-finalizer.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: k8s-monitoring-remove-alloy-and-finalizer
  namespace: monitoring
  labels:
    app.kubernetes.io/name: k8s-monitoring-remove-alloy-and-finalizer
    app.kubernetes.io/instance: k8s-monitoring
    helm.sh/chart: k8s-monitoring-4.6.1
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 0
  template:
    metadata:
      name: k8s-monitoring-remove-alloy-and-finalizer
      labels:
        app.kubernetes.io/name: k8s-monitoring
        app.kubernetes.io/instance: k8s-monitoring
        linkerd.io/inject: disabled
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: k8s-monitoring-remove-alloy-and-finalizer
      initContainers:
        - name: delete-alloy-instances
          image: "registry.k8s.io/kubectl:v1.34.9"
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - delete
            - alloy/k8s-monitoring-alloy-logs
            - --ignore-not-found=true
            - --wait=true
            - --timeout=120s
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 4242
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: remove-finalizers
          image: "registry.k8s.io/kubectl:v1.34.9"
          imagePullPolicy: IfNotPresent
          command:
            - kubectl
          args:
            - patch
            - --namespace=monitoring
            - --type=merge
            - --patch={"metadata":{"finalizers":null}}
            - deployment/k8s-monitoring-alloy-operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 4242
            seccompProfile:
              type: RuntimeDefault

