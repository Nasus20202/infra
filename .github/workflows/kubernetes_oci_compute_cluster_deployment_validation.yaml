name: kubernetes/oci/compute/cluster - Deployment validation
run-name: |
  kubernetes/oci/compute/cluster - Validate `${{ github.event.pull_request.title || github.event.head_commit.message || github.ref_name }}`

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/oci/compute/cluster/**
      - "!kubernetes/oci/compute/cluster/.argocd-state/**"
      - .github/workflows/kubernetes_oci_compute_cluster_deployment_validation.yaml
  pull_request:
    branches:
      - main

jobs:
  validate-manifests:
    name: Validate manifests

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The app token pushes the state commit to the protected branch (the app is
      # on the ruleset bypass list) and posts the PR comment. It is not available
      # to Dependabot/fork PRs (no secrets), so fall back to GITHUB_TOKEN there.
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.ARGOCD_VALIDATE_ACTION_CLIENT_ID }}
          private-key: ${{ secrets.ARGOCD_VALIDATE_ACTION_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Look up the numeric id of the app's bot user so commits get the app's
      # noreply email (and avatar) instead of github-actions[bot].
      - name: Resolve app bot identity
        id: app-bot
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Build and validate ArgoCD Manifests
        uses: nasus20202/argocd-validate-action@f9ad43d7ba6b1c22b9fe8bce5b39b06cfa9270a6 # v3
        env:
          GIT_AUTHOR_NAME: ${{ steps.app-bot.outputs.id && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ steps.app-bot.outputs.id && format('{0}+{1}[bot]@users.noreply.github.com', steps.app-bot.outputs.id, steps.app-token.outputs.app-slug) || '41898282+github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ steps.app-bot.outputs.id && format('{0}[bot]', steps.app-token.outputs.app-slug) || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ steps.app-bot.outputs.id && format('{0}+{1}[bot]@users.noreply.github.com', steps.app-bot.outputs.id, steps.app-token.outputs.app-slug) || '41898282+github-actions[bot]@users.noreply.github.com' }}
        with:
          apps-dir: "kubernetes/oci/compute/cluster/argocd-apps"
          state-dir: "kubernetes/oci/compute/cluster/.argocd-state"
          skip-resources: "CustomResourceDefinition,Plan"
          comment-on-pr: "true"
          commit-state: ${{ github.event_name == 'push' }}
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
